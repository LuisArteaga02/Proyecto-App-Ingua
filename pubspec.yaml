name: ingua
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.5.0
  flutter_dotenv: ^5.2.1
  pdf: ^3.10.4
  printing: ^5.11.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/logo.png
    - .env

  uses-material-design: true

flutter_launcher_icons:
  image_path: "assets/logo.png"
  android: true
  windows:
    generate: true
    image_path: "assets/logo.png"
    icon_size: 48